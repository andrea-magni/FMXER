<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(ellipse 85vw 60vw at 50% 30%, rgba(255, 143, 0, 0.42), rgba(196, 62, 0, 0.18) 45%, transparent 75%),
      linear-gradient(175deg, #2c2c30 0%, #1b1b1e 55%, #140d09 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    box-sizing: border-box; padding: 8vw 6vw 7vw;
    color: #fff;
  }
  .top { display: flex; flex-direction: column; align-items: center; }
  .rocket { width: 54vw; filter: drop-shadow(0 2vw 3vw rgba(0,0,0,0.55)); margin-bottom: 5vw; }
  .name { font-size: 15.5vw; font-weight: 700; letter-spacing: 0.6vw; line-height: 1; }
  .line { width: 46vw; height: 0.9vw; border-radius: 0.5vw; background: linear-gradient(90deg, #c43e00, #ffa726); margin: 4vw 0 3.6vw; }
  .tag { font-size: 8.2vw; font-weight: 600; color: #ffa726; text-align: center; line-height: 1.22; }
  .foot { font-size: 5.6vw; color: #b5b5b8; text-align: center; line-height: 1.3; }
</style></head>
<body>
  <div class="top">
    <img class="rocket" src="../../docs/public/logo-hero.png">
    <div class="name">FMXER</div>
    <div class="line"></div>
    <div class="tag">declarative UIs<br>built in code</div>
  </div>
  <div class="foot">for Embarcadero Delphi<br>FireMonkey</div>
</body></html>
